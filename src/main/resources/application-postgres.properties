# Postgres profile for the docker-compose stack
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/artemis_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:artemis_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:artemis_password}

spring.jpa.show-sql=true
spring.jpa.format_sql=true
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_audit
