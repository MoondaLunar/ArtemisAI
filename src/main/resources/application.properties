# Artemis AI - default profile: H2 in-memory, runs out of the box.
# For the docker-compose stack (postgres), run with --spring.profiles.active=postgres
spring.datasource.url=jdbc:h2:mem:artemis
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.format_sql=true
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_audit
